; Container flight software. Build: pio run   Flash: pio run -t upload   Monitor: pio device monitor
[env:container]
platform = espressif32@6.9.0      ; Arduino-ESP32 2.0.x
board = esp32-s3-devkitc-1        ; TODO: set to the board Electronics picks
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
build_flags = -DCAVSAT_CONTAINER
lib_deps =
