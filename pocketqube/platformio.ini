; PocketQube flight software. Build: pio run   Flash: pio run -t upload
[env:pocketqube]
platform = espressif32@6.9.0      ; Arduino-ESP32 2.0.x
board = esp32-s3-devkitc-1        ; TODO: set to the board Electronics picks (needs a camera interface)
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
build_flags = -DCAVSAT_POCKETQUBE
lib_deps =
    ; TODO: IMU, magnetometer, barometer, GNSS (e.g. sparkfun/SparkFun u-blox GNSS v3), current sensor
